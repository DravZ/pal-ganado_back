spring.application.name=back
spring.datasource.url=jdbc:postgresql://localhost:5432/pala_vaca
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jackson.property-naming-strategy=SNAKE_CASE
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=PALAVACA_SESSION
server.servlet.session.cookie.max-age=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://drav-z-pal-ganado-front-phi.vercel.app,http://localhost:5173,http://localhost:4173}
